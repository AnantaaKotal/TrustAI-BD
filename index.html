<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Conference</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 16px;
      padding: 48px 64px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 2.5rem; margin-bottom: 8px; color: #e94560; }
    p  { font-size: 1.1rem; color: #aaa; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎉 It Works!</h1>
    <p>Your GitHub Pages site is live and ready.</p>
    <p style="margin-top:16px; font-size:0.9rem; color:#555;">Replace this with your real conference page.</p>
  </div>
</body>
</html>
